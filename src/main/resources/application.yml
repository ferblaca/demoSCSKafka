debug: true
server:
  port: 8080
  servlet:
    context-path: /demo-stream-kafka
logging:
  level:
    root: INFO
    org.springframework.kafka.listener.KafkaMessageListenerContainer: INFO
spring:
  docker:
    compose:
      skip:
        in-tests: false
      file: "file:@project.basedir@/src/main/resources/compose/docker-compose.yml"
      lifecycle-management: start-and-stop
  kafka:
    bootstrap-servers: localhost:9092
  cloud:
    function:
      definition: completeConsumer1;completeConsumer2
    stream:
      defaultBinder: kafka1
      binders:
        kafka1:
          type: kafka
          environment:
            spring:
              main:
                sources: com.example.demoStreamKafka.sources.KafkaProducerConsumerConfiguration
        kafka2:
          type: kafka
          environment:
            spring:
              main:
                sources: com.example.demoStreamKafka.sources.KafkaProducerConsumerConfiguration
      output-bindings: foo-out-0
      bindings:
        completeConsumer1-in-0:
          binder: kafka1
          group: my-group-complete1
          destination: input-topic
        completeConsumer2-in-0:
          binder: kafka2
          group: my-group-complete2
          destination: input-topic
        foo-out-0:
          binder: kafka1
          destination: input-topic

management:
  health:
    binders:
      enabled: true
  endpoint:
    health:
      show-details: ALWAYS

custom-client-id:
  enabled: true
